spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/airline_db}
spring.datasource.username=${DB_USERNAME:airline_user}
spring.datasource.password=${DB_PASSWORD:airline_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080
